# Database migrations. The server applies them automatically at start-up
# (see infrastructure/db/migrations/runner.py); from this folder you can also run
#   alembic upgrade head          apply everything
#   alembic revision --autogenerate -m "what changed"   after changing models.py
# The database address comes from DATABASE_URL (the same .env as the server).
[alembic]
script_location = %(here)s/src/jubran/infrastructure/db/migrations
prepend_sys_path = %(here)s/src
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
