[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jubran_api"
version = "1.0.0"
description = "Jubran AI Restaurant Backend Service"
authors = [{name = "Engineering Team"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",  # [asyncio] brings greenlet, which SQLAlchemy 2.1 no longer installs by default
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pgvector>=0.2.5",
    "google-genai>=1.0.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "tzdata>=2024.1",  # time-zone database for Windows (Amman time)
]

[project.optional-dependencies]
# Tests; also used by the CI/test commands in run.txt.
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Migration template, needed to create new migrations from an installed package.
"jubran.infrastructure.db.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
